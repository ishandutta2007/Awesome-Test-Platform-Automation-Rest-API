<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accent-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="wire-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern -->
    <pattern id="circuit-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
      <circle cx="0" cy="40" r="1.5" fill="#818cf8" fill-opacity="0.25" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-6px) translateX(4px); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pingDot {
        0% { r: 3px; opacity: 1; }
        50% { r: 7px; opacity: 0.4; }
        100% { r: 3px; opacity: 1; }
      }
      @keyframes blinkGreen {
        0%, 100% { fill: #10b981; filter: drop-shadow(0 0 2px #10b981); }
        50% { fill: #34d399; filter: drop-shadow(0 0 6px #10b981); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .glow-orb-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .glow-orb-2 {
        animation: pulseGlow 9s ease-in-out infinite alternate;
        transform-origin: 1000px 320px;
      }
      .floating-card-1 {
        animation: floatSlow1 5.5s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatSlow2 6.5s ease-in-out infinite;
      }
      .floating-card-3 {
        animation: floatSlow3 7s ease-in-out infinite;
      }
      .flow-path {
        stroke-dasharray: 8, 8;
        animation: flowDash 12s linear infinite;
      }
      .flow-path-fast {
        stroke-dasharray: 6, 6;
        animation: flowDash 6s linear infinite;
      }
      .pulse-beacon {
        animation: pingDot 2.5s ease-in-out infinite;
      }
      .live-indicator {
        animation: blinkGreen 2s ease-in-out infinite;
      }
      .text-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .text-sub {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .text-mono {
        font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Grid overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#circuit-grid)" />

  <!-- Ambient Light Orbs (Background depth) -->
  <circle class="glow-orb-1" cx="220" cy="90" r="160" fill="url(#glow-cyan)" filter="url(#neon-glow)" />
  <circle class="glow-orb-2" cx="980" cy="330" r="180" fill="url(#glow-purple)" filter="url(#neon-glow)" />

  <!-- Dynamic Network / Flow Topology Lines (Lower visual layer) -->
  <g opacity="0.45">
    <path class="flow-path" d="M 120 360 C 260 300, 340 370, 520 340 S 820 380, 1080 340" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-path-fast" d="M 80 80 C 300 120, 500 40, 750 90 S 1000 60, 1120 100" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <path d="M 600 30 L 600 70 M 600 350 L 600 390" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- ================= DYNAMIC CARDS & PILLS (BACKGROUND/MIDGROUND) ================= -->

  <!-- Top-Right Card: Rest API Telemetry / Status -->
  <g class="floating-card-1" transform="translate(850, 42)" filter="url(#card-shadow)">
    <rect width="290" height="110" rx="12" fill="url(#card-grad-1)" stroke="#334155" stroke-width="1.2" />
    <!-- Window buttons -->
    <circle cx="20" cy="18" r="4" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="18" r="4" fill="#eab308" opacity="0.8" />
    <circle cx="48" cy="18" r="4" fill="#10b981" opacity="0.8" />
    <text x="64" y="22" fill="#94a3b8" class="text-mono" font-size="11" font-weight="600">POST /v1/test/sessions</text>
    
    <!-- Code block / Response -->
    <rect x="14" y="34" width="262" height="62" rx="6" fill="#090d16" fill-opacity="0.9" />
    <text x="26" y="52" fill="#38bdf8" class="text-mono" font-size="11">status: <tspan fill="#34d399">201 Created</tspan></text>
    <text x="26" y="68" fill="#94a3b8" class="text-mono" font-size="10.5">grid_nodes: <tspan fill="#f1f5f9">248 active</tspan></text>
    <text x="26" y="84" fill="#a78bfa" class="text-mono" font-size="10.5">latency: <tspan fill="#38bdf8">14ms</tspan> • <tspan fill="#10b981">CI/CD Synced</tspan></text>
  </g>

  <!-- Top-Left Interactive Pill: Protocol Badge -->
  <g class="floating-card-3" transform="translate(60, 48)" filter="url(#card-shadow)">
    <rect width="180" height="38" rx="19" fill="url(#pill-grad)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6" />
    <circle class="live-indicator" cx="80" cy="67" r="4.5" />
    <text x="94" y="72" fill="#e2e8f0" class="text-mono" font-size="11.5" font-weight="600">REST API v2.4</text>
  </g>

  <!-- Bottom-Left Card: Platform Grid Flow / Live Nodes -->
  <g class="floating-card-2" transform="translate(60, 275)" filter="url(#card-shadow)">
    <rect width="280" height="95" rx="12" fill="url(#card-grad-1)" stroke="#334155" stroke-width="1.2" />
    <text x="18" y="26" fill="#f8fafc" class="text-title" font-size="12" font-weight="600">Grid Fleet Orchestration</text>
    <circle class="live-indicator" cx="254" cy="22" r="4" />
    
    <!-- Mini progress flow -->
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="72" height="38" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
      <text x="36" y="16" fill="#94a3b8" class="text-mono" font-size="9" text-anchor="middle">PARALLEL</text>
      <text x="36" y="30" fill="#38bdf8" class="text-mono" font-size="11" font-weight="bold" text-anchor="middle">128 VMs</text>

      <!-- Arrow -->
      <path d="M 78 19 L 92 19 M 88 15 L 93 19 L 88 23" fill="none" stroke="#64748b" stroke-width="1.5" />

      <rect x="98" y="0" width="72" height="38" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="134" y="16" fill="#94a3b8" class="text-mono" font-size="9" text-anchor="middle">SUCCESS</text>
      <text x="134" y="30" fill="#34d399" class="text-mono" font-size="11" font-weight="bold" text-anchor="middle">99.98%</text>

      <!-- Arrow -->
      <path d="M 176 19 L 190 19 M 186 15 L 191 19 L 186 23" fill="none" stroke="#64748b" stroke-width="1.5" />

      <rect x="196" y="0" width="48" height="38" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
      <text x="220" y="16" fill="#94a3b8" class="text-mono" font-size="9" text-anchor="middle">SPEC</text>
      <text x="220" y="30" fill="#c084fc" class="text-mono" font-size="11" font-weight="bold" text-anchor="middle">AUTO</text>
    </g>
  </g>

  <!-- Bottom-Right Card: Platforms Quick Badges Carousel / Pill Group -->
  <g class="floating-card-1" transform="translate(810, 268)" filter="url(#card-shadow)">
    <rect width="330" height="102" rx="12" fill="url(#card-grad-1)" stroke="#334155" stroke-width="1.2" />
    <text x="18" y="24" fill="#94a3b8" class="text-mono" font-size="11" font-weight="600">TEST RUNNERS &amp; CLOUD APIS</text>

    <!-- Badges Row 1 -->
    <g transform="translate(16, 36)">
      <!-- Pill: Playwright -->
      <rect x="0" y="0" width="90" height="24" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1" />
      <text x="45" y="16" fill="#38bdf8" class="text-mono" font-size="10" font-weight="600" text-anchor="middle">Playwright</text>

      <!-- Pill: Selenium -->
      <rect x="98" y="0" width="82" height="24" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="139" y="16" fill="#34d399" class="text-mono" font-size="10" font-weight="600" text-anchor="middle">Selenium</text>

      <!-- Pill: Cypress -->
      <rect x="188" y="0" width="102" height="24" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="239" y="16" fill="#c084fc" class="text-mono" font-size="10" font-weight="600" text-anchor="middle">Cypress Cloud</text>
    </g>

    <!-- Badges Row 2 -->
    <g transform="translate(16, 68)">
      <!-- Pill: BrowserStack -->
      <rect x="0" y="0" width="96" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="48" y="16" fill="#fbbf24" class="text-mono" font-size="10" font-weight="600" text-anchor="middle">BrowserStack</text>

      <!-- Pill: LambdaTest -->
      <rect x="104" y="0" width="92" height="24" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
      <text x="150" y="16" fill="#f472b6" class="text-mono" font-size="10" font-weight="600" text-anchor="middle">LambdaTest</text>

      <!-- Pill: Appium -->
      <rect x="204" y="0" width="86" height="24" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1" />
      <text x="247" y="16" fill="#cbd5e1" class="text-mono" font-size="10" font-weight="600" text-anchor="middle">Appium API</text>
    </g>
  </g>

  <!-- ================= FOREGROUND HERO CONTENT (GUARANTEED CLEAR & CRISP) ================= -->
  
  <g id="hero-foreground" transform="translate(600, 150)" text-anchor="middle">
    <!-- Category Pill Tag -->
    <g transform="translate(-160, -38)">
      <rect width="320" height="30" rx="15" fill="#0f172a" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1.2" />
      <circle class="live-indicator" cx="20" cy="15" r="4" />
      <text x="170" y="20" fill="#38bdf8" class="text-mono" font-size="11.5" font-weight="600" text-anchor="middle" letter-spacing="1.5">TEST PLATFORM AUTOMATION</text>
    </g>

    <!-- Main Title with high contrast & vibrant gradient -->
    <text x="0" y="44" fill="#ffffff" class="text-title" font-size="44" font-weight="800" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.8))">
      Awesome Test Platform
    </text>
    <text x="0" y="94" class="text-title" font-size="44" font-weight="800" fill="url(#accent-cyan-purple)" filter="drop-shadow(0 4px 20px rgba(56,189,248,0.4))">
      Automation REST API
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="134" fill="#94a3b8" class="text-sub" font-size="15.5" font-weight="400" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.9))">
      Curated directory of Cloud Infrastructure APIs, Device Grids, Test Runners &amp; CI/CD Orchestration
    </text>

    <!-- Key Metrics / Capability Pills in Foreground -->
    <g transform="translate(0, 168)">
      <!-- Feature 1 -->
      <g transform="translate(-270, 0)">
        <rect x="0" y="0" width="165" height="28" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1" />
        <text x="82" y="18" fill="#cbd5e1" class="text-mono" font-size="11" text-anchor="middle">⚡ Grid Orchestration</text>
      </g>
      <!-- Feature 2 -->
      <g transform="translate(-85, 0)">
        <rect x="0" y="0" width="170" height="28" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1" />
        <text x="85" y="18" fill="#cbd5e1" class="text-mono" font-size="11" text-anchor="middle">☁️ Device Cloud APIs</text>
      </g>
      <!-- Feature 3 -->
      <g transform="translate(105, 0)">
        <rect x="0" y="0" width="165" height="28" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1" />
        <text x="82" y="18" fill="#cbd5e1" class="text-mono" font-size="11" text-anchor="middle">🔄 CI/CD Telemetry</text>
      </g>
    </g>
  </g>

  <!-- Subtle border outline around banner -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
